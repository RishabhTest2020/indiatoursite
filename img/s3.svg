  <rect x="10" y="33" width="3" height="9" rx="1.5" fill="#047857"/>
  <!-- Right Ear Cup -->
  <rect x="44" y="30" width="8" height="15" rx="4" fill="url(#grad3)"/>
  <rect x="51" y="33" width="3" height="9" rx="1.5" fill="#047857"/>
  <!-- Microphone Boom -->
  <path d="M48 40C48 48 42 53 34 53H29" stroke="url(#accentTeal)" stroke-width="2.5" stroke-linecap="round"/>
